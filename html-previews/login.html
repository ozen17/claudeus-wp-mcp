<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Claudeus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-purple-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm px-6 py-3 rounded-full">
                <i class="fas fa-bolt text-blue-400 text-2xl"></i>
                <span class="text-3xl font-bold text-white">Claudeus</span>
            </div>
            <p class="text-gray-300 mt-4">Assistant WordPress IA - Plateforme SaaS</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Bienvenue !</h2>
            <p class="text-gray-600 mb-6">Connectez-vous pour gérer vos sites WordPress</p>

            <form class="space-y-4">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Adresse email
                    </label>
                    <input
                        type="email"
                        placeholder="vous@exemple.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Mot de passe
                    </label>
                    <input
                        type="password"
                        placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    >
                </div>

                <!-- Remember Me & Forgot -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="rounded text-blue-500">
                        <span class="text-gray-600">Se souvenir de moi</span>
                    </label>
                    <a href="#" class="text-blue-600 hover:text-blue-700">Mot de passe oublié ?</a>
                </div>

                <!-- Submit Button -->
                <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    Se connecter
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">Nouveau sur Claudeus ?</span>
                </div>
            </div>

            <!-- Register Link -->
            <a href="index.html" class="block w-full border-2 border-gray-300 hover:border-blue-500 text-gray-700 hover:text-blue-600 font-semibold py-3 rounded-lg transition duration-200 text-center">
                Créer un compte gratuitement
            </a>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-gray-300 text-sm">
            <p>&copy; 2025 Claudeus. Tous droits réservés.</p>
            <div class="mt-2 space-x-4">
                <a href="#" class="hover:text-white">Conditions d'utilisation</a>
                <a href="#" class="hover:text-white">Confidentialité</a>
                <a href="#" class="hover:text-white">Support</a>
            </div>
        </div>
    </div>
</body>
</html>
